<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kids settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: {{bg}}; font-family: Inter, sans-serif; color: #FFFFFF">
<div style="position: absolute; right: 96px; top: 44px; font-size: 32px; font-weight: 600; color: rgba(255,255,255,0.7)">19:05</div>
<div style="position: absolute; left: 96px; top: 60px; font-size: 26px; font-weight: 600; color: rgba(255,255,255,0.55)">Settings</div>
<div style="position: absolute; left: 96px; top: 110px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 84px; line-height: 1; letter-spacing: -1px; text-transform: uppercase">Kids</div>

<div style="position: absolute; left: 96px; top: 270px; width: 820px">
<div style="font-size: 22px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; margin-bottom: 14px">Who it is for</div>
<div style="font-size: 30px; font-weight: 600">Ages to show</div>
<div style="font-size: 22px; color: rgba(255,255,255,0.55); margin: 4px 0 16px">Left or Right to move, OK to switch on or off</div>
<div style="display: flex; gap: 16px; margin-bottom: 36px">
<sc-for list="{{ages}}" as="a" hint-placeholder-count="4">
<div style="height: 64px; box-sizing: border-box; padding: 0 26px; border-radius: 32px; display: flex; align-items: center; font-size: 26px; font-weight: 600; background: {{a.bg}}; border: 1px solid {{a.border}}; color: {{a.color}}; box-shadow: {{a.ring}}">{{a.label}}</div>
</sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="height: 88px; box-sizing: border-box; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; border-radius: 16px; background: {{r.bg}}">
<div style="flex: 1">
<div style="font-size: 30px; font-weight: 600">{{r.label}}</div>
<div style="font-size: 22px; color: rgba(255,255,255,0.55); margin-top: 2px">{{r.sub}}</div>
</div>
<div style="font-size: 28px; font-weight: 600; color: {{r.valColor}}">{{r.value}}</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 1000px; top: 270px; width: 824px">
<div style="font-size: 22px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; margin-bottom: 14px">Lists on the Kids page</div>
<div style="font-size: 24px; color: rgba(255,255,255,0.6); margin-bottom: 14px; line-height: 1.4">TMDB lists shown as tiles, in this order.</div>
<sc-for list="{{lists}}" as="r" hint-placeholder-count="5">
<div style="height: 80px; box-sizing: border-box; padding: 0 20px; border-radius: 16px; display: flex; align-items: center; margin-bottom: 6px; background: {{r.bg}}; box-shadow: {{r.ring}}">
<div style="font-size: 30px; font-weight: 600; flex: 1; color: {{r.color}}">{{r.label}}</div>
<div style="font-size: 22px; color: rgba(255,255,255,0.55); margin-right: 24px">{{r.hint}}</div>
<div style="font-size: 26px; font-weight: 600; color: {{r.vc}}">{{r.value}}</div>
</div>
</sc-for>
<div style="height: 72px; display: flex; align-items: center; padding: 0 20px; font-size: 30px; font-weight: 600; color: {{accent}}">+ Add a TMDB list</div>

<div style="font-size: 22px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; margin: 28px 0 10px">Lock</div>
<sc-for list="{{lock}}" as="r" hint-placeholder-count="2">
<div style="height: 80px; box-sizing: border-box; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center">
<div style="flex: 1"><div style="font-size: 30px; font-weight: 600">{{r.label}}</div><div style="font-size: 22px; color: rgba(255,255,255,0.55); margin-top: 2px">{{r.sub}}</div></div>
<div style="font-size: 28px; font-weight: 600; color: {{r.vc}}">{{r.value}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = '#AEBBF0';
    const bg = 'radial-gradient(ellipse 1000px 760px at 80% 16%, rgba(154,47,69,0.82), rgba(154,47,69,0) 70%), radial-gradient(ellipse 900px 640px at 8% 96%, rgba(47,91,168,0.62), rgba(47,91,168,0) 70%), radial-gradient(ellipse 700px 500px at 100% 90%, rgba(154,47,69,0.3), rgba(154,47,69,0) 70%), #0B0912';
    const on = '#4CD08A';
    const dim = 'rgba(255,255,255,0.75)';
    const ageDefs = [['0\u20135', true], ['6\u20139', true], ['10\u201312', false], ['13+', false]];
    const ages = ageDefs.map((a, i) => ({ label: a[0], bg: a[1] ? 'rgba(255,255,255,0.18)' : 'transparent', border: a[1] ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.28)', color: a[1] ? '#FFFFFF' : 'rgba(255,255,255,0.6)', ring: i === 1 ? '0 0 0 3px rgba(255,255,255,0.95)' : 'none' }));
    const rows = [
      { label: 'Highest rating', sub: 'Hard limit on everything inside Kids (UK certificates)', value: 'PG', valColor: dim, bg: 'transparent' },
      { label: 'Search inside Kids', sub: 'Uses the same rating limit', value: 'On', valColor: on, bg: 'transparent' },
      { label: 'Greeting and look', sub: 'Names, fun font, background', value: 'Change', valColor: dim, bg: 'transparent' }
    ];
    const L = (label, hint, value, vc, foc) => ({ label: label, hint: hint, value: value, vc: vc, color: '#FFFFFF', bg: foc ? 'rgba(255,255,255,0.16)' : 'transparent', ring: foc ? '0 0 0 3px rgba(255,255,255,0.95)' : 'none' });
    const lists = [
      L('Top family', '48 films', 'On', on, false),
      L('Little ones', '62 titles', 'On', on, true),
      L('Animation', '120 films', 'On', on, false),
      L('Songs and singalongs', '31 titles', 'On', on, false),
      L('Based on a book', '54 films', 'Off', 'rgba(255,255,255,0.5)', false)
    ];
    const lock = [
      { label: 'PIN to leave Kids', sub: 'Typed with the remote number buttons', value: 'Off', vc: dim },
      { label: 'Change PIN', sub: '', value: '\u2022\u2022\u2022\u2022', vc: dim }
    ];
    return { bg: bg, accent: accent, ages: ages, rows: rows, lists: lists, lock: lock };
  }
}
</script>
</body>
</html>
