<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, one tile row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
.dest{width:220px;height:220px;flex:none;border-radius:24px;border:0;background:linear-gradient(160deg,#1C2A25,#121B18);color:#EDEFE8;position:relative;padding:0;text-align:left}
.dest svg{position:absolute;left:28px;top:28px;width:64px;height:64px;color:#B4C0B8}
.dest span{position:absolute;left:28px;bottom:26px;font-size:28px;font-weight:600}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; background: #0B1210; position: relative; overflow: hidden; box-sizing: border-box; font-family: Inter, sans-serif; color: #EDEFE8">

<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse at 72% 28%, #4A8F86 0%, #1B3B38 42%, #0B1210 80%)"></div>
<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(90deg, rgba(11,18,16,0.96) 0%, rgba(11,18,16,0.65) 42%, rgba(11,18,16,0) 75%)"></div>
<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(0deg, rgba(11,18,16,0.97) 0%, rgba(11,18,16,0.75) 30%, rgba(11,18,16,0) 58%)"></div>

<div style="position: absolute; left: 96px; top: 48px; display: flex; align-items: center; gap: 20px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}"></div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px">[App name]</div>
</div>
<div style="position: absolute; right: 96px; top: 52px; font-size: 32px; font-weight: 600; color: #B4C0B8">19:05</div>

<div style="position: absolute; left: 96px; top: 150px; width: 860px">
<div style="font-size: 24px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}">Continue watching</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 88px; line-height: 1.1; margin-top: 12px">Harbour Lights</div>
<div style="font-size: 28px; color: #D5DCD6; margin-top: 8px">S2 · E4 · 31 min left · 2024 · 15</div>
<div style="font-size: 30px; line-height: 1.5; color: #C3CCC6; margin-top: 16px; width: 760px">[Episode synopsis, two lines at most, pulled from TMDB.]</div>
<div style="display: flex; gap: 20px; margin-top: 28px">
<div style="display: flex; align-items: center; gap: 12px; font-size: 24px; color: #9AA8A0"><span style="border: 2px solid #3A4A43; border-radius: 10px; padding: 4px 14px; color: #EDEFE8; font-weight: 600">OK</span>Resume</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 24px; color: #9AA8A0"><span style="border: 2px solid #3A4A43; border-radius: 10px; padding: 4px 14px; color: #EDEFE8; font-weight: 600">Hold OK</span>Add to list</div>
</div>
</div>

<div style="position: absolute; left: 96px; top: 580px; height: 320px; display: flex; gap: 24px; align-items: flex-end">

<div style="width: 320px; height: 320px; flex: none; position: relative; border-radius: 28px; background: linear-gradient(135deg, #3C7A74, #10302F); box-shadow: 0 0 0 4px {{accent}}, 0 24px 60px rgba(0,0,0,0.6); overflow: hidden">
<div style="position: absolute; left: 24px; bottom: 30px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px">Harbour Lights</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(255,255,255,0.22)"><div style="width: 62%; height: 8px; background: {{accent}}"></div></div>
</div>

<sc-for list="{{continueRow}}" as="c" hint-placeholder-count="3">
<div style="width: 220px; height: 220px; flex: none; position: relative; border-radius: 24px; background: {{c.bg}}; overflow: hidden">
<div style="position: absolute; left: 20px; bottom: 26px; font-weight: 600; font-size: 26px">{{c.title}}</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.22)"><div style="width: {{c.pct}}; height: 6px; background: #EDEFE8"></div></div>
</div>
</sc-for>

<div style="width: 2px; height: 220px; flex: none; background: #2B3A34; margin: 0 8px"></div>

<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z M10 9l5 3-5 3z"></path></svg><span>Movies</span></button>
<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z M8 21h8 M12 17v4"></path></svg><span>TV</span></button>
<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z M4 16V6a2 2 0 0 1 2-2h10"></path></svg><span>Collections</span></button>
<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M16 8l-2.5 5.5L8 16l2.5-5.5z"></path></svg><span>Discover</span></button>
<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12 M8 12h12 M8 18h12 M4 6h.01 M4 12h.01 M4 18h.01"></path></svg><span>Lists</span></button>
<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a12 12 0 0 1 16 0 M7 12.5a8 8 0 0 1 10 0 M10 16a4 4 0 0 1 4 0 M12 19.5h.01"></path></svg><span>Streaming</span></button>
<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M8.5 14a4.5 4.5 0 0 0 7 0 M9 9.5h.01 M15 9.5h.01"></path></svg><span>Kids</span></button>
<button type="button" class="dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"></path></svg><span>Search</span></button>

</div>

<div style="position: absolute; left: 96px; top: 944px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px">Fresh and good</div>
<div style="position: absolute; left: 96px; top: 1000px; display: flex; gap: 24px">
<sc-for list="{{posters}}" as="p" hint-placeholder-count="8">
<div style="width: 180px; height: 270px; flex: none; border-radius: 14px; background: {{p.bg}}"></div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6FE3B0","options":["#6FE3B0","#7CC4FF","#FF8A73","#C9A7FF"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6FE3B0';
    const continueRow = [
      { title: 'The Salt Road', pct: '35%', bg: 'linear-gradient(135deg, #6B4E7A, #241730)' },
      { title: 'Quiet Orbit', pct: '71%', bg: 'linear-gradient(135deg, #8A5A3C, #2B1A10)' },
      { title: 'Night Ferry', pct: '18%', bg: 'linear-gradient(135deg, #3C5F8A, #101C2E)' }
    ];
    const posters = [
      { bg: 'linear-gradient(160deg, #5B7A3C, #16240E)' },
      { bg: 'linear-gradient(160deg, #8A4B3C, #2B120E)' },
      { bg: 'linear-gradient(160deg, #3C6C8A, #0E202B)' },
      { bg: 'linear-gradient(160deg, #8A7A3C, #2B260E)' },
      { bg: 'linear-gradient(160deg, #5E3C8A, #1A0E2B)' },
      { bg: 'linear-gradient(160deg, #3C8A6C, #0E2B20)' },
      { bg: 'linear-gradient(160deg, #8A3C6C, #2B0E20)' },
      { bg: 'linear-gradient(160deg, #3C4E8A, #0E1429)' },
      { bg: 'linear-gradient(160deg, #5B7A3C, #16240E)' },
      { bg: 'linear-gradient(160deg, #8A4B3C, #2B120E)' }
    ];
    return { accent: accent, continueRow: continueRow, posters: posters };
  }
}
</script>
</body>
</html>
