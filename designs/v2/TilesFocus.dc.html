<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, tile focused</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
.tile{width:140px;height:140px;border-radius:24px;border:0;background:#121B18;color:#9AA8A0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:600;padding:0}
.ic{width:48px;height:48px}
.tilef{width:200px;height:200px;border-radius:32px;border:0;background:#1E2E28;color:#EDEFE8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:30px;font-weight:600;padding:0;box-shadow:0 0 0 4px #6FE3B0,0 20px 50px rgba(0,0,0,0.55)}
.icf{width:72px;height:72px;color:#6FE3B0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; background: #0B1210; position: relative; overflow: hidden; box-sizing: border-box; font-family: Inter, sans-serif; color: #EDEFE8">

<div style="position: absolute; left: 96px; top: 40px; height: 200px; display: flex; gap: 16px; align-items: center">
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z M10 9l5 3-5 3z"></path></svg><span>Movies</span></button>
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z M8 21h8 M12 17v4"></path></svg><span>TV</span></button>
<button type="button" class="tilef"><svg class="icf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z M4 16V6a2 2 0 0 1 2-2h10"></path></svg><span>Collections</span></button>
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M16 8l-2.5 5.5L8 16l2.5-5.5z"></path></svg><span>Discover</span></button>
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12 M8 12h12 M8 18h12 M4 6h.01 M4 12h.01 M4 18h.01"></path></svg><span>Lists</span></button>
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a12 12 0 0 1 16 0 M7 12.5a8 8 0 0 1 10 0 M10 16a4 4 0 0 1 4 0 M12 19.5h.01"></path></svg><span>Streaming</span></button>
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M8.5 14a4.5 4.5 0 0 0 7 0 M9 9.5h.01 M15 9.5h.01"></path></svg><span>Kids</span></button>
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"></path></svg><span>Search</span></button>
<button type="button" class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2"></path></svg><span>Settings</span></button>
</div>
<div style="position: absolute; right: 96px; top: 84px; font-size: 32px; font-weight: 600; color: #9AA8A0">19:05</div>

<div style="position: absolute; left: 96px; top: 290px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 56px; line-height: 1.1">Collections</div>
<div style="position: absolute; left: 96px; top: 362px; font-size: 28px; color: #9AA8A0">[24 collections · most recently updated first]</div>

<div style="position: absolute; left: 96px; top: 420px; display: flex; gap: 28px">
<sc-for list="{{collections}}" as="k" hint-placeholder-count="5">
<div style="width: 440px; height: 250px; flex: none; position: relative; border-radius: 20px; background: {{k.bg}}; overflow: hidden">
<div style="position: absolute; right: 24px; top: 24px; display: flex; gap: 8px">
<div style="width: 56px; height: 84px; border-radius: 8px; background: rgba(255,255,255,0.18)"></div>
<div style="width: 56px; height: 84px; border-radius: 8px; background: rgba(255,255,255,0.26); margin-top: 12px"></div>
<div style="width: 56px; height: 84px; border-radius: 8px; background: rgba(255,255,255,0.34); margin-top: 24px"></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 28px 24px; background: linear-gradient(0deg, rgba(5,10,9,0.88), rgba(5,10,9,0))">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 36px">{{k.title}}</div>
<div style="font-size: 24px; color: #D5DCD6; margin-top: 2px">{{k.count}}</div>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 96px; top: 740px; opacity: 0.45">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; margin-bottom: 24px">Continue watching</div>
<div style="display: flex; gap: 32px">
<div style="width: 640px; height: 360px; flex: none; border-radius: 20px; background: linear-gradient(135deg, #3C7A74, #10302F)"></div>
<sc-for list="{{continueRow}}" as="c" hint-placeholder-count="3">
<div style="width: 420px; height: 236px; flex: none; border-radius: 16px; background: {{c.bg}}"></div>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6FE3B0","options":["#6FE3B0","#7CC4FF","#FF8A73","#C9A7FF"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6FE3B0';
    const collections = [
      { title: 'Slow burns', count: '18 titles', bg: 'linear-gradient(135deg, #5B7A3C, #16240E)' },
      { title: 'Rainy day', count: '12 titles', bg: 'linear-gradient(135deg, #3C6C8A, #0E202B)' },
      { title: 'Short and sharp', count: '31 titles', bg: 'linear-gradient(135deg, #8A4B3C, #2B120E)' },
      { title: 'Family night', count: '22 titles', bg: 'linear-gradient(135deg, #5E3C8A, #1A0E2B)' },
      { title: 'Late night', count: '15 titles', bg: 'linear-gradient(135deg, #3C4E8A, #0E1429)' }
    ];
    const continueRow = [
      { bg: 'linear-gradient(135deg, #6B4E7A, #241730)' },
      { bg: 'linear-gradient(135deg, #8A5A3C, #2B1A10)' },
      { bg: 'linear-gradient(135deg, #3C5F8A, #101C2E)' }
    ];
    return { accent: accent, collections: collections, continueRow: continueRow };
  }
}
</script>
</body>
</html>
