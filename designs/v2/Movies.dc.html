<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movies page, wine and navy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: {{bg}}; font-family: Inter, sans-serif; color: #FFFFFF">

<div style="position: absolute; right: 96px; top: 44px; font-size: 32px; font-weight: 600; color: rgba(255,255,255,0.7)">19:05</div>

<div style="position: absolute; left: 0; top: 22px; width: 1920px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
<div style="display: flex; gap: 48px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; color: {{c.color}}; padding-bottom: 8px; border-bottom: 3px solid {{c.line}}">{{c.label}}</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 96px; top: 160px; width: 1300px">
<div style="font-size: 24px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}">{{hero.eyebrow}}</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 96px; line-height: 1; letter-spacing: -1px; text-transform: uppercase; margin-top: 10px">{{hero.title}}</div>
<div style="display: flex; align-items: center; gap: 32px; margin-top: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: {{hero.svcColor}}; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="{{hero.svcPath}}"></path></svg>
</div>
<div style="font-size: 26px; font-weight: 600">{{hero.svc}}</div>
</div>
<div style="font-size: 28px; color: rgba(255,255,255,0.78)">{{hero.meta}}</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 24px; color: rgba(255,255,255,0.78)"><span style="border: 1px solid rgba(255,255,255,0.5); border-radius: 10px; padding: 3px 14px; color: #FFFFFF; font-weight: 600">OK</span>Details</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 24px; color: rgba(255,255,255,0.78)"><span style="width: 22px; height: 22px; border-radius: 50%; background: #F5C84C"></span>Add to list</div>
</div>
<div style="font-size: 28px; line-height: 1.4; margin-top: 12px; width: 800px; color: rgba(255,255,255,0.88)">{{hero.synopsis}}</div>
</div>

<sc-for list="{{labels}}" as="l" hint-placeholder-count="2">
<div style="position: absolute; left: 96px; top: {{l.top}}px; display: flex; align-items: center; gap: 12px; opacity: {{l.op}}">
<sc-if value="{{l.hasIcon}}" hint-placeholder-val="{{false}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8 M15 7h6v6"></path></svg>
</sc-if>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px">{{l.text}}</div>
<div style="font-size: 24px; color: rgba(255,255,255,0.55)">{{l.sub}}</div>
</div>
</sc-for>

<sc-for list="{{items}}" as="p" hint-placeholder-count="14">
<div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; height: {{p.rowH}}px; display: flex; align-items: flex-end">
<sc-if value="{{p.hasRank}}" hint-placeholder-val="{{false}}">
<div style="width: {{p.numW}}px; flex: none; text-align: right; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: {{p.rankFs}}px; line-height: 0.76; color: {{p.rankFill}}; -webkit-text-stroke: 4px {{p.rankStroke}}">{{p.rank}}</div>
</sc-if>
<div style="width: {{p.w}}px; height: {{p.h}}px; flex: none; margin-left: {{p.ml}}px; position: relative; border-radius: 14px; overflow: hidden; background: {{p.bg}}; box-shadow: {{p.ring}}">
<div style="position: absolute; left: {{p.sx}}; top: {{p.sy}}; width: {{p.ss}}; height: {{p.ssh}}; border-radius: 50%; background: {{p.sc}}"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: rgba(10,8,24,0.5); -webkit-clip-path: polygon(0 60%, 22% 36%, 40% 58%, 62% 28%, 82% 54%, 100% 40%, 100% 100%, 0 100%); clip-path: polygon(0 60%, 22% 36%, 40% 58%, 62% 28%, 82% 54%, 100% 40%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: rgba(5,4,16,0.62); -webkit-clip-path: polygon(0 58%, 20% 40%, 44% 62%, 70% 36%, 100% 58%, 100% 100%, 0 100%); clip-path: polygon(0 58%, 20% 40%, 44% 62%, 70% 36%, 100% 58%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(0deg, rgba(0,0,0,0.6), rgba(0,0,0,0))"></div>
<div style="position: absolute; left: 14px; right: 14px; bottom: 16px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: {{p.fs}}px; letter-spacing: 2px; text-transform: uppercase; line-height: 1.05; color: #FFFFFF">{{p.title}}</div>
</div>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focus":{"editor":"enum","options":["trending","top10"],"default":"trending"},"kind":{"editor":"enum","options":["movie","tv"],"default":"movie"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const focus = this.props.focus === 'top10' ? 'top10' : 'trending';
    const accent = '#F4C8B6';
    const bg = 'radial-gradient(ellipse 1000px 760px at 80% 16%, rgba(154,47,69,0.82), rgba(154,47,69,0) 70%), radial-gradient(ellipse 900px 640px at 8% 96%, rgba(47,91,168,0.62), rgba(47,91,168,0) 70%), radial-gradient(ellipse 700px 500px at 100% 90%, rgba(154,47,69,0.3), rgba(154,47,69,0) 70%), #0B0912';
    const kind = this.props.kind === 'tv' ? 'tv' : 'movie';
    const act = kind === 'tv' ? 2 : 1;
    const labels = ['Home', 'Movies', 'TV', 'Collections', 'Discover'];
    const cats = labels.map((label, i) => ({
      label: label,
      color: i === act ? '#FFFFFF' : 'rgba(255,255,255,0.42)',
      line: i === act ? accent : 'transparent'
    }));
    const art = [
      { title: 'Salt Meridian', bg: 'linear-gradient(170deg, #F0B070 0%, #C0553C 48%, #2A1210 100%)', sc: 'radial-gradient(circle at 35% 35%, #FFE8BC, #F2A85C)', sx: '26%', sy: '12%', ss: '50%', ssh: '33%' },
      { title: 'Lantern Season', bg: 'linear-gradient(170deg, #EBD08F 0%, #B06C3A 50%, #2B1608 100%)', sc: 'radial-gradient(circle at 40% 40%, #FFF4D6, #F0D08A)', sx: '48%', sy: '10%', ss: '36%', ssh: '24%' },
      { title: 'Velvet Static', bg: 'linear-gradient(170deg, #2A3F8F 0%, #141F52 55%, #080C24 100%)', sc: 'radial-gradient(circle at 35% 35%, #B8D0FF, #5A82E0)', sx: '20%', sy: '22%', ss: '60%', ssh: '40%' },
      { title: 'The Long Dusk', bg: 'linear-gradient(170deg, #2B8A93 0%, #0F3A44 55%, #04141A 100%)', sc: 'radial-gradient(circle at 40% 40%, #F2FFFF, #BDE8EA)', sx: '54%', sy: '8%', ss: '30%', ssh: '20%' },
      { title: 'Marrow Lane', bg: 'linear-gradient(170deg, #E2AEB0 0%, #7A4A64 52%, #241528 100%)', sc: 'radial-gradient(circle at 40% 40%, #FFE8DE, #F5C0B0)', sx: '16%', sy: '16%', ss: '44%', ssh: '29%' },
      { title: 'Copper Sky', bg: 'linear-gradient(170deg, #A6D17E 0%, #3F7A3A 50%, #10260F 100%)', sc: 'radial-gradient(circle at 40% 40%, #FFF8C8, #F2E58A)', sx: '40%', sy: '14%', ss: '40%', ssh: '27%' },
      { title: 'Pale Orchard', bg: 'linear-gradient(170deg, #F08A4A 0%, #A8321E 50%, #2A0A06 100%)', sc: 'radial-gradient(circle at 40% 40%, #FFE08A, #FFB030)', sx: '22%', sy: '20%', ss: '52%', ssh: '35%' },
      { title: 'Tin Coast', bg: 'linear-gradient(170deg, #9ACBEE 0%, #2C5C88 50%, #0A1B2E 100%)', sc: 'radial-gradient(circle at 40% 40%, #FFFFFF, #CFE6F8)', sx: '50%', sy: '12%', ss: '34%', ssh: '23%' },
      { title: 'Distant Weather', bg: 'linear-gradient(170deg, #C9A3E8 0%, #5A3C8C 52%, #1A1030 100%)', sc: 'radial-gradient(circle at 40% 40%, #FFFFFF, #E6D2F8)', sx: '30%', sy: '14%', ss: '42%', ssh: '28%' }
    ];
    const pick = (order) => order.map((i) => art[i % art.length]);
    const services = [
      { name: 'Prism', color: '#7C5CFF', path: 'M12 3l9 16H3z' },
      { name: 'Tidal', color: '#1E9E9A', path: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z' },
      { name: 'Ember', color: '#D9552B', path: 'M12 2l10 10-10 10L2 12z' }
    ];
    const FOCUS_RING = '0 0 0 3px rgba(255,255,255,0.95), 0 20px 50px rgba(0,0,0,0.55)';
    const REST_RING = '0 10px 24px rgba(0,0,0,0.35)';

    const plainRow = (order, top, hasFocus) => {
      const items = pick(order);
      const rowH = hasFocus ? 315 : 264;
      let x = 96;
      return items.map((a, i) => {
        const f = hasFocus && i === 0;
        const w = f ? 210 : 176;
        const h = f ? 315 : 264;
        const out = Object.assign({}, a, {
          left: x, top: top, rowH: rowH, w: w, h: h, ml: 0,
          fs: f ? 22 : 18, ring: f ? FOCUS_RING : REST_RING,
          hasRank: false, rank: '', rankFs: 0, rankStroke: 'transparent', rankFill: 'transparent', numW: 0
        });
        x += w + 40;
        return out;
      });
    };
    const rankedRow = (order, top, hasFocus) => {
      const items = pick(order);
      const rowH = hasFocus ? 315 : 264;
      let x = 96;
      return items.map((a, i) => {
        const f = hasFocus && i === 0;
        const w = f ? 210 : 176;
        const h = f ? 315 : 264;
        const out = Object.assign({}, a, {
          left: x, top: top, rowH: rowH, w: w, h: h, ml: -20,
          fs: f ? 22 : 18, ring: f ? FOCUS_RING : REST_RING,
          hasRank: true, rank: String(i + 1), rankFs: f ? 300 : 260, numW: 170,
          rankStroke: f ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.7)',
          rankFill: f ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.06)'
        });
        x += 170 - 20 + w + 40;
        return out;
      });
    };

        const H = {
      movie: {
        trending: { eyebrow: 'Trending this week', title: 'Lantern Season', meta: '2025 \u00b7 12A \u00b7 2h 04m \u00b7 \u2605 8.1', synopsis: '[Synopsis from TMDB, two lines at most. A festival town, a missing mapmaker, and one night to find her.]', s: 1 },
        top10: { eyebrow: '#1 in the top 10 today', title: 'Night Ferry', meta: '2017 \u00b7 15 \u00b7 1h 48m \u00b7 \u2605 7.6', synopsis: '[Synopsis from TMDB, two lines at most. A night ferry, a locked cabin, and a passenger list that does not add up.]', s: 0 },
        peekAfterTrending: { text: 'Top 10 today', sub: 'Most watched in your region' },
        peekAfterTop: { text: 'Because you watched Quiet Orbit', sub: 'From your history' }
      },
      tv: {
        trending: { eyebrow: 'Trending this week', title: 'The Quiet Tide', meta: '2025 \u00b7 15 \u00b7 3 seasons \u00b7 \u2605 8.4', synopsis: '[Synopsis from TMDB, two lines at most. A coastal town where the sea gives back what it took.]', s: 2 },
        top10: { eyebrow: '#1 in the top 10 today', title: 'Paper Kingdoms', meta: '2024 \u00b7 12 \u00b7 2 seasons \u00b7 \u2605 8.0', synopsis: '[Synopsis from TMDB, two lines at most.]', s: 0 },
        peekAfterTrending: { text: 'Top 10 today', sub: 'Most watched in your region' },
        peekAfterTop: { text: 'Your next episodes', sub: 'Shows you are watching' }
      }
    }[kind];
    const pickH = focus === 'trending' ? H.trending : H.top10;
    const sv = services[pickH.s];
    const hero = { eyebrow: pickH.eyebrow, title: pickH.title, meta: pickH.meta, synopsis: pickH.synopsis, svc: sv.name, svcColor: sv.color, svcPath: sv.path };
    let items, labelList;
    if (focus === 'trending') {
      items = plainRow([1, 6, 3, 0, 5, 8, 2], 570, true).concat(rankedRow([3, 0, 6, 2, 8, 5, 1], 972, false));
      labelList = [
        { text: 'Trending this week', sub: 'Updated daily', top: 520, op: 1, hasIcon: true },
        { text: H.peekAfterTrending.text, sub: H.peekAfterTrending.sub, top: 928, op: 0.6, hasIcon: false }
      ];
    } else {
      items = rankedRow([3, 0, 6, 2, 8, 5, 1], 570, true).concat(plainRow([0, 2, 4, 6, 3, 5, 7, 8, 1], 972, false));
      labelList = [
        { text: 'Top 10 today', sub: 'Most watched in your region', top: 520, op: 1, hasIcon: false },
        { text: H.peekAfterTop.text, sub: H.peekAfterTop.sub, top: 928, op: 0.6, hasIcon: false }
      ];
    }
    return { bg: bg, accent: accent, cats: cats, items: items, labels: labelList, hero: hero };
  }
}
</script>
</body>
</html>
