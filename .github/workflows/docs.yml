name: docs

# Only when the docs themselves change: a commit touching src/ cannot alter the
# published pages, so it should not spend a Pages deploy.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blume.config.ts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Pages deploys from the live site: a second run must not overwrite a newer one
# halfway through, so this queue does not cancel in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run docs:build

      # Fails the build on a broken internal link rather than publishing one.
      - name: validate links
        run: npm run docs:validate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
