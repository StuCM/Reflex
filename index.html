<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex</title>
<!-- No bundler here either, so the order is the cascade: the tokens and the
     shared parts first, then one file per screen, each of which may override
     them. screens.css is last because .msg-hint has to keep beating .dt-hint,
     as it did when the two were one file. tools/check-es5.js fails if a file in
     css/ is missing from this list. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/browse.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/show.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div id="browse" class="view">
  <!-- The backdrop of whatever is focused, and two flat scrims over it so the
       title reads on the left and the tiles read along the bottom. -->
  <!-- Two layers, so a new backdrop fades over the old one rather than cutting.
       The wrapper carries the dense dimming; the layers carry the fade. -->
  <div id="hero-art">
    <div id="hero-art-a" class="hero-layer"></div>
    <div id="hero-art-b" class="hero-layer"></div>
  </div>
  <div id="hero-scrim-x"></div>
  <div id="hero-scrim-y"></div>
  <div id="masthead">
    <div id="mh-row">&nbsp;</div>
    <div id="mh-title">&nbsp;</div>
    <div id="mh-meta"></div>
    <div id="mh-desc"></div>
    <div id="mh-cast"></div>
  </div>
  <!-- Phosphor's magnifying glass, inlined: the app runs from file:// on the
       TV, so there is no CDN to fetch an icon font from. -->
  <div id="top-right">
    <span class="pill"><svg class="pill-icon" width="24" height="24" viewBox="0 0 256 256"
      fill="none" stroke="currentColor" stroke-width="16"><circle cx="112" cy="112" r="80"/>
      <line x1="168" y1="168" x2="224" y2="224"/></svg>Search</span>
  </div>
  <!-- What the keys mean while green has Continue watching in select mode.
       Empty and hidden the rest of the time. -->
  <div id="browse-hint" class="hidden"></div>
  <div id="sidebar"><div id="sidebar-list"></div></div>
  <div id="viewport"><div id="rows"></div></div>
</div>

<div id="show" class="view hidden">
  <div id="sh-art"></div>
  <div id="sh-shade"></div>
  <div id="sh-head">
    <div id="sh-title"></div>
    <div id="sh-meta"></div>
    <div id="sh-summary"></div>
  </div>
  <div id="sh-seasons"></div>
  <div id="sh-episodes"></div>
  <!-- Season recaps, below the episodes and empty until asked for: a search
       costs 100 units of a day's 10,000, so it waits for a keypress. -->
  <div id="sh-recaps"></div>
  <div class="msg-hint" id="sh-hint"></div>
</div>

<div id="detail" class="view hidden">
  <div id="dt-art"></div>
  <div id="dt-shade"></div>
  <!-- Everything the film is, down the left, with the backdrop to the right:
       an amber kicker, the title, a row of chips, a row of ratings and the
       description. -->
  <div id="dt-header">
    <div id="dt-kicker"></div>
    <div id="dt-title"></div>
    <div id="dt-chips"></div>
    <div id="dt-ratings"></div>
    <div id="dt-tagline"></div>
    <div id="dt-summary"></div>
    <div id="dt-names"></div>
  </div>
  <div id="dt-body">
    <!-- Play, then a round button per choice: the copy, the quality, the audio
         track and the subtitles, each captioned with what is chosen now. The
         popup below is the same menu the player uses. -->
    <div id="dt-actions"></div>
    <div id="dt-crew"></div>
    <div id="dt-extras-label" class="dt-label hidden">Extras</div>
    <div id="dt-extras"></div>
    <div id="dt-cast"></div>
  </div>
  <div id="dt-menu" class="hidden"></div>
  <div class="msg-hint dt-hint">◀ ▶ choose · OK to open it · BACK to the rail</div>
</div>

<div id="link" class="view hidden">
  <div class="centre">
    <div class="link-lead">Go to</div>
    <div class="link-url">plex.tv/link</div>
    <div class="link-lead">and enter</div>
    <div id="link-code" class="link-code">- - - -</div>
  </div>
</div>

<div id="search" class="view hidden">
  <div class="centre">
    <div class="msg-title">Search films</div>
    <input id="search-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false">
    <div class="msg-hint">OK to search · BACK to cancel</div>
  </div>
</div>

<div id="devices" class="view hidden">
  <div class="centre">
    <div class="msg-title">Which of these are you?</div>
    <div class="msg-body">Viewing from devices you don't claim is hidden from Continue watching.</div>
    <div id="device-list"></div>
    <div class="msg-hint">OK to toggle · BACK to save</div>
  </div>
</div>

<div id="message" class="view hidden">
  <div class="centre">
    <div id="message-title" class="msg-title"></div>
    <div id="message-body" class="msg-body"></div>
    <div class="msg-hint">BACK to return</div>
  </div>
</div>

<video id="video" class="hidden" preload="auto"></video>

<!-- A series' theme tune, played quietly on its own page. One element for the
     life of the app, and never at the same time as the video: two sources over
     one ARC link is the fault this project can least afford. -->
<audio id="theme" preload="none"></audio>

<!-- Subtitles are drawn here rather than burned into the picture: burning them
     in is a transcode, and a transcode of a 4K file is what gets the session
     killed. See js/subs.js. -->
<div id="subtitle" class="hidden"></div>

<div id="osd-skip" class="hidden"></div>

<!-- Offered when an episode ends: what comes next, and what OK will do. It
     waits for a keypress unless the sidebar's autoplay setting says otherwise,
     and a new season always waits. -->
<div id="upnext" class="hidden">
  <div id="un-still"></div>
  <div id="un-text">
    <div id="un-show"></div>
    <div id="un-title"></div>
    <div id="un-hint"></div>
  </div>
</div>

<div id="menu" class="hidden"></div>

<!-- Nothing leaves Continue watching without this. Hiding an item and marking
     it watched are different things, and only one of them is reversible, so
     the confirmation names which one is about to happen. -->
<div id="confirm" class="hidden"></div>

<!-- Chapters are cards rather than a list: a still and a timecode say more
     about where you are going than "Chapter 7" ever does. -->
<div id="osd-chapters" class="hidden"><div id="osd-chapters-inner"></div></div>

<div id="osd" class="hidden">
  <div id="osd-title"><span class="osd-back">‹</span><span id="osd-name"></span></div>
  <div id="osd-track">
    <div id="osd-time"></div>
    <div id="osd-bar">
      <div id="osd-buffered"></div>
      <div id="osd-fill"></div>
      <div id="osd-ticks"></div>
      <div id="osd-knob"></div>
    </div>
    <div id="osd-total"></div>
  </div>
  <!-- Transport on the left, the four things that can be changed on the right,
       each captioned with what is chosen now. js/player.js fills both. -->
  <div id="osd-controls">
    <div id="osd-left"></div>
    <div id="osd-right"></div>
  </div>
  <div id="osd-hint"></div>
</div>

<!-- A season recap, played where it was chosen. It is not library content: it
     never reaches the guard, the player or a Plex session. -->
<div id="recap" class="hidden">
  <iframe id="recap-frame" frameborder="0" allow="autoplay" allowfullscreen></iframe>
  <div class="msg-hint" id="recap-hint">BACK closes it</div>
</div>

<div id="toast" class="hidden"></div>
<div id="debug"></div>

<!-- No bundler, so load order is the dependency graph: settings, then the
     services, then the pieces of screen, then the app that wires them up.
     tools/check-es5.js fails if a file in js/ is missing from this list. -->
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/panel.js"></script>
<script src="js/subs.js"></script>
<script src="js/media.js"></script>
<script src="js/servers.js"></script>
<script src="js/merge.js"></script>
<script src="js/plex.js"></script>
<script src="js/tmdb.js"></script>
<script src="js/youtube.js"></script>
<script src="js/art.js"></script>

<script src="js/ui.js"></script>
<script src="js/menu.js"></script>
<script src="js/rows.js"></script>
<script src="js/rail.js"></script>
<script src="js/meta.js"></script>
<script src="js/guard.js"></script>
<script src="js/shows.js"></script>
<script src="js/masthead.js"></script>
<script src="js/detail.js"></script>
<script src="js/showpage.js"></script>
<script src="js/devices.js"></script>
<script src="js/discovery.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/browse.js"></script>
<script src="js/player.js"></script>

<script src="js/app.js"></script>
</body>
</html>
