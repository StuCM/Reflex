<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="browse" class="view">
  <div id="masthead">
    <div id="mh-title">&nbsp;</div>
    <div id="mh-meta"></div>
    <div id="mh-badges"></div>
    <div id="mh-summary"></div>
  </div>
  <div id="sections"></div>
  <div id="viewport"><div id="rows"></div></div>
</div>

<div id="detail" class="view hidden">
  <div id="dt-art"></div>
  <div id="dt-shade"></div>
  <div id="dt-body">
    <div id="dt-title"></div>
    <div id="dt-meta"></div>
    <div id="dt-tagline"></div>
    <div id="dt-summary"></div>
    <div id="dt-crew"></div>
    <div id="dt-sources-label" class="dt-label">Play from</div>
    <div id="dt-sources"></div>
    <div id="dt-extras-label" class="dt-label hidden">Extras</div>
    <div id="dt-extras"></div>
    <div id="dt-cast"></div>
  </div>
  <div class="msg-hint dt-hint">↑↓ choose a copy · OK to play · BACK to the rail</div>
</div>

<div id="link" class="view hidden">
  <div class="centre">
    <div class="link-lead">Go to</div>
    <div class="link-url">plex.tv/link</div>
    <div class="link-lead">and enter</div>
    <div id="link-code" class="link-code">- - - -</div>
  </div>
</div>

<div id="search" class="view hidden">
  <div class="centre">
    <div class="msg-title">Search films</div>
    <input id="search-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false">
    <div class="msg-hint">OK to search · BACK to cancel</div>
  </div>
</div>

<div id="devices" class="view hidden">
  <div class="centre">
    <div class="msg-title">Which of these are you?</div>
    <div class="msg-body">Viewing from devices you don't claim is hidden from Continue watching.</div>
    <div id="device-list"></div>
    <div class="msg-hint">OK to toggle · BACK to save</div>
  </div>
</div>

<div id="message" class="view hidden">
  <div class="centre">
    <div id="message-title" class="msg-title"></div>
    <div id="message-body" class="msg-body"></div>
    <div class="msg-hint">BACK to return</div>
  </div>
</div>

<video id="video" class="hidden" preload="none"></video>
<div id="osd" class="hidden"><div id="osd-title"></div><div id="osd-time"></div></div>

<div id="toast" class="hidden"></div>
<div id="debug"></div>

<!-- No bundler, so load order is the dependency graph: settings, then the
     services, then the pieces of screen, then the app that wires them up.
     tools/check-es5.js fails if a file in js/ is missing from this list. -->
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/media.js"></script>
<script src="js/servers.js"></script>
<script src="js/merge.js"></script>
<script src="js/plex.js"></script>
<script src="js/tmdb.js"></script>

<script src="js/ui.js"></script>
<script src="js/rows.js"></script>
<script src="js/rail.js"></script>
<script src="js/meta.js"></script>
<script src="js/guard.js"></script>
<script src="js/masthead.js"></script>
<script src="js/detail.js"></script>
<script src="js/devices.js"></script>
<script src="js/discovery.js"></script>
<script src="js/browse.js"></script>
<script src="js/player.js"></script>

<script src="js/app.js"></script>
</body>
</html>
